<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting to Google Cloud Samples Catalog</title>
    <meta http-equiv="refresh" content="0; url=https://googlecloudsamples.github.io/catalog/">
    <link rel="canonical" href="https://googlecloudsamples.github.io/catalog/">
    <meta name="robots" content="noindex">
    <script>
      window.location.replace("https://googlecloudsamples.github.io/catalog/");
    </script>
  </head>
  <body>
    <p>
      This page has moved to
      <a href="https://googlecloudsamples.github.io/catalog/">https://googlecloudsamples.github.io/catalog/</a>.
    </p>
  </body>
</html>
